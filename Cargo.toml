[workspace]
resolver = "2"
members = [
  "crates/crypto",
  "crates/redaction",
  "crates/storage",
  "crates/core",
  "crates/exporter",
  "crates/providers",
  "crates/profiles",
  "crates/backup",
  "crates/proxy",
  "apps/proxy",
  "apps/cli",
  "apps/desktop/src-tauri"
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15"
url = "2.5"
arboard = "3.6"
dirs = "6.0"
rfd = "0.15"
sha2 = "0.10"
subtle = "2.6"
toml = "0.8"
thiserror = "2.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
zeroize = { version = "1.8", features = ["derive"] }
rpassword = "7.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
