<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SecretHub · Command Orbit</title>
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <style>
    :root{--bg:#071126;--bg-2:#0b1730;--surface:#0d1b36;--surface-2:#102345;--line:#203760;--line-strong:#31518e;--text:#eef4ff;--muted:#91a6c9;--soft:#bfd0ef;--blue:#5278ff;--blue-2:#85a3ff;--green:#55dfb0;--orange:#ff9a72;--violet:#a98cff;--danger:#ff817e;--shadow:0 24px 80px rgba(0,0,0,.32)}
    *{box-sizing:border-box}body{margin:0;min-width:760px;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue-2);outline-offset:2px}
    .app{min-height:100vh;display:grid;grid-template-columns:220px minmax(0,1fr) 320px;background:var(--bg)}
    .sidebar{display:flex;flex-direction:column;padding:22px 14px 16px;border-right:1px solid var(--line);background:#08132a}.brand{display:flex;align-items:center;gap:11px;padding:0 8px 26px;border-bottom:1px solid var(--line)}.brand-mark{width:30px;height:30px;display:grid;place-items:center;border:1px solid var(--blue);border-radius:6px;color:var(--blue-2);font-weight:800;font-size:11px;box-shadow:0 0 18px #5278ff44}.brand strong{display:block;font-size:17px;letter-spacing:-.03em}.brand small{display:block;margin-top:2px;color:var(--muted);font-size:10px;letter-spacing:.11em;text-transform:uppercase}.nav{display:grid;gap:3px;margin-top:20px}.nav-label{margin:18px 9px 6px;color:#607aa8;font-size:10px;letter-spacing:.16em;text-transform:uppercase}.nav-btn{display:flex;align-items:center;gap:10px;width:100%;padding:10px 10px;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--muted);text-align:left}.nav-btn:hover,.nav-btn.active{border-color:#284b88;background:#112957;color:var(--text)}.nav-icon{width:15px;color:var(--blue-2);text-align:center;font-size:15px}.nav-count{margin-left:auto;color:#6f89b7;font-size:11px}.sidebar-bottom{margin-top:auto}.vault-card{padding:13px 11px;border:1px solid var(--line);background:#0d1d3a;color:var(--muted);font-size:11px}.vault-card strong{display:block;margin-top:6px;color:var(--green);font-size:11px}.vault-dot{display:inline-block;width:7px;height:7px;margin-right:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px #55dfb022}
    .main{min-width:0;padding:25px 27px 74px}.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:18px}.eyebrow,.kicker{color:#7695d1;font-size:10px;letter-spacing:.17em;text-transform:uppercase}.topbar h1{margin:6px 0 3px;font-size:28px;letter-spacing:-.05em}.subtitle{margin:0;color:var(--muted);font-size:13px}.top-actions{display:flex;gap:8px;align-items:center}.btn{border:1px solid var(--line-strong);border-radius:6px;padding:9px 12px;background:#0f2143;color:var(--soft);font-weight:600}.btn:hover{border-color:var(--blue-2);background:#17336b}.btn.primary{border-color:var(--blue);background:var(--blue);color:#fff}.btn.primary:hover{background:#6c8dff}.btn.ghost{border-color:transparent;background:transparent}.btn.danger{border-color:#7d3e53;color:#ff9a9d;background:#25142d}.searchbar{display:flex;align-items:center;gap:10px;margin-top:24px;padding:0 13px;border:1px solid var(--line-strong);border-radius:7px;background:#091733}.searchbar span{color:var(--blue-2);font-size:19px}.searchbar input{width:100%;padding:12px 0;border:0;background:transparent;color:var(--text);outline:0}.searchbar input::placeholder{color:#7189b4}.searchbar kbd{padding:3px 7px;border:1px solid var(--line);border-radius:4px;color:#91a6c9;font-size:10px;white-space:nowrap}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.summary-item{padding:13px 14px;border:1px solid var(--line);background:#0c1a34}.summary-item small{display:block;color:var(--muted);font-size:10px}.summary-item strong{display:block;margin-top:4px;color:var(--blue-2);font-size:21px;letter-spacing:-.04em}.summary-item strong.green{color:var(--green)}
    .section{margin-top:16px;border:1px solid var(--line);background:#091733}.section-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:17px 18px;border-bottom:1px solid var(--line)}.section-head h2{margin:5px 0 3px;font-size:18px;letter-spacing:-.04em}.section-head p{margin:0;color:var(--muted);font-size:11px}.section-tools{display:flex;gap:8px;align-items:center}.section-tools input,.section-tools select,.config-form input,.config-form select{border:1px solid var(--line);border-radius:5px;background:#0b1933;color:var(--soft);padding:9px 10px;font-size:11px}.section-tools input{width:180px}.provider-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:13px}.provider-card{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:11px;align-items:start;padding:13px;border:1px solid var(--line);background:#0d1e3d;transition:border-color .15s,background .15s}.provider-card:hover,.provider-card.selected{border-color:#4e77d2;background:#102852}.provider-card input{margin-top:3px;accent-color:var(--blue)}.provider-copy strong{display:block;font-size:13px}.provider-copy small{display:block;margin-top:3px;color:var(--muted);font-size:10px}.model-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}.model-tag{padding:3px 5px;border:1px solid #294978;border-radius:4px;color:#9db6eb;font:10px ui-monospace,SFMono-Regular,Consolas,monospace}.model-tag.more{color:#7e98c8}.provider-endpoint{overflow:hidden;margin-top:10px;color:#7189b6;font:10px ui-monospace,SFMono-Regular,Consolas,monospace;text-overflow:ellipsis;white-space:nowrap}.provider-actions{display:flex;flex-direction:column;align-items:flex-end;gap:6px}.provider-actions .btn{padding:7px 9px;font-size:11px}.provider-actions a{color:#86a5f5;font-size:10px;text-decoration:none;white-space:nowrap}.provider-actions a:hover{text-decoration:underline}.status-dot{width:7px;height:7px;margin-top:5px;border-radius:50%;background:#7187ad}.status-dot.configured{background:var(--green);box-shadow:0 0 0 4px #55dfb022}.provider-footer{display:flex;justify-content:space-between;padding:11px 15px;border-top:1px solid var(--line);color:var(--muted);font-size:10px}.activity{margin-top:16px;border:1px solid var(--line);background:#091733}.activity table{width:100%;border-collapse:collapse;text-align:left}.activity th{padding:10px 13px;background:#102346;color:#86a0d2;font-size:10px;font-weight:600}.activity td{padding:10px 13px;border-top:1px solid #142a50;color:#b5c8e8;font-size:11px}.activity td.muted{color:#7188b4}.activity td.link{color:#87a6ff}.bottom-bar{position:fixed;bottom:0;left:220px;right:320px;display:flex;justify-content:space-between;align-items:center;padding:10px 27px;border-top:1px solid var(--line-strong);background:#091733ee;backdrop-filter:blur(10px);color:var(--muted);font-size:11px}.bottom-actions{display:flex;gap:8px}
    .inspector{padding:24px 19px;border-left:1px solid var(--line);background:#091733}.inspector-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.inspector h2{margin:4px 0 2px;font-size:18px}.inspector-sub{margin:0;color:var(--muted);font-size:11px}.close-button{border:0;background:transparent;color:#9db1d5;font-size:21px}.detail-hero{margin-top:19px;padding:15px;border:1px solid var(--line-strong);background:#0e2042}.detail-hero strong{display:block;font-size:14px}.detail-hero span{display:block;margin-top:5px;color:var(--muted);font-size:11px}.detail-status{display:inline-flex;align-items:center;gap:7px;margin-top:10px;color:var(--green);font-size:11px}.detail-tabs{display:flex;gap:18px;margin-top:18px;border-bottom:1px solid var(--line)}.detail-tab{padding:10px 0;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted);font-size:11px}.detail-tab.active{border-color:var(--blue-2);color:var(--text)}.detail-list{display:grid;gap:15px;padding:19px 0}.detail-row label{display:block;color:#7089b7;font-size:10px}.detail-row strong{display:block;margin-top:5px;color:#d8e4fa;font-size:12px;font-weight:500}.masked{letter-spacing:.1em}.detail-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding-top:6px}.detail-actions .wide{grid-column:1/-1}.safe-box{margin-top:18px;padding:12px;border:1px solid #25554f;background:#0d2b38;color:#93d8cf;font-size:10px;line-height:1.6}.quick-env{margin-top:16px;padding:14px;border:1px solid var(--line);background:#0d1d3a}.quick-env h3{margin:0;color:#d8e4fa;font-size:12px}.quick-env code{display:block;margin-top:10px;color:#9ab4ed;font:10px/1.7 ui-monospace,SFMono-Regular,Consolas,monospace;word-break:break-all}.empty{padding:45px;text-align:center;color:var(--muted);font-size:12px}.modal-backdrop{position:fixed;inset:0;display:grid;place-items:center;background:#020817b8;z-index:10}.modal{width:min(520px,calc(100vw - 50px));padding:23px;border:1px solid #3e62ab;background:#0b1a36;box-shadow:var(--shadow)}.modal-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px}.modal h2{margin:4px 0;font-size:18px}.modal p{margin:0;color:var(--muted);font-size:11px}.config-form{display:grid;gap:13px}.config-form label{display:grid;gap:6px;color:#8ca4cc;font-size:11px}.config-form input,.config-form select{width:100%;padding:10px}.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}.toast{position:fixed;right:344px;bottom:70px;padding:11px 14px;border:1px solid #3a78a4;background:#0e3440;color:#b9eee6;font-size:11px;z-index:20;box-shadow:var(--shadow)}
    .view-panel{padding:30px 0}.view-panel .section{margin-top:0}.project-row{display:flex;justify-content:space-between;align-items:center;padding:14px 17px;border-top:1px solid var(--line)}.project-row strong{display:block}.project-row small{display:block;margin-top:4px;color:var(--muted);font:10px ui-monospace,SFMono-Regular,Consolas,monospace}.profile-chip{display:inline-flex;margin-left:7px;padding:3px 5px;border:1px solid #394f83;color:#a1b7e5;font-size:10px}.notice{margin:13px;padding:11px;border:1px solid #624f85;background:#17183d;color:#bdc3f1;font-size:11px}
    @media(max-width:1250px){.app{grid-template-columns:205px minmax(0,1fr) 290px}.bottom-bar{left:205px;right:290px}.provider-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.main{padding-left:20px;padding-right:20px}.toast{right:314px}}
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    const providers=[
      {id:'openai',name:'OpenAI',region:'Global',models:['GPT-5.6 Sol','GPT-5.6 Terra','GPT-5.6 Luna'],base:'https://api.openai.com/v1',key:'https://platform.openai.com/api-keys',configured:true,model:'gpt-5.6-sol'},
      {id:'xiaomi',name:'Xiaomi 小米',region:'CN',models:['MiMo-V2.5-Pro'],base:'https://token-plan-cn.xiaomimimo.com/v1',key:'https://platform.xiaomimimo.com/',configured:false,model:'mimo-v2.5-pro'},
      {id:'zai',name:'Z.ai',region:'Global',models:['GLM-5.3','GLM-5.1'],base:'https://api.z.ai/api/coding/paas/v4',key:'https://z.ai/manage-apikey/apikey-list',configured:false,model:'glm-5.3'},
      {id:'anthropic',name:'Anthropic',region:'Global',models:['Claude Fable 5.1','Claude Opus 5','Claude Sonnet 5'],base:'https://api.anthropic.com',key:'https://console.anthropic.com/settings/keys',configured:true,model:'claude-opus-5'},
      {id:'gemini',name:'Google Gemini',region:'Global',models:['Gemini 3.8 Flash','Gemini 3.7 Flash','Gemini 3.1 Pro'],base:'https://generativelanguage.googleapis.com/v1beta/openai',key:'https://aistudio.google.com/apikey',configured:false,model:'gemini-3.8-flash'},
      {id:'deepseek',name:'DeepSeek',region:'CN',models:['DeepSeek V4 Flash','DeepSeek V4 Pro','V4 Flash Vision'],base:'https://api.deepseek.com',key:'https://platform.deepseek.com/api_keys',configured:false,model:'deepseek-v4-flash'},
      {id:'minimax',name:'MiniMax',region:'CN / Global',models:['MiniMax-M2.7','M2.7 Highspeed','MiniMax-M2.5'],base:'https://api.minimaxi.com/v1',key:'https://platform.minimaxi.com/user-center/basic-information/interface-key',configured:false,model:'MiniMax-M2.7'},
      {id:'glm',name:'智谱 GLM',region:'CN',models:['GLM-5.3','GLM-5.1','GLM-5'],base:'https://open.bigmodel.cn/api/coding/paas/v4',key:'https://bigmodel.cn/usercenter/apikeys',configured:false,model:'glm-5.3'},
      {id:'kimi',name:'月之暗面 Kimi',region:'CN',models:['Kimi K3','Kimi K2.7 Code','Kimi K2.6'],base:'https://api.moonshot.cn/v1',key:'https://platform.moonshot.cn/console/api-keys',configured:false,model:'kimi-k3'},
      {id:'perplexity',name:'Perplexity',region:'Global',models:['Sonar Pro','Sonar','Sonar Reasoning'],base:'https://api.perplexity.ai',key:'https://www.perplexity.ai/settings/api',configured:false,model:'sonar-pro'},
      {id:'mistral',name:'Mistral AI',region:'Global',models:['Mistral Medium 3.5','Mistral Small 4','Codestral'],base:'https://api.mistral.ai/v1',key:'https://console.mistral.ai/api-keys',configured:false,model:'mistral-medium-latest'},
      {id:'groq',name:'Groq',region:'Global',models:['GPT-OSS 120B','Qwen 3.8 27B','Groq Compound'],base:'https://api.groq.com/openai/v1',key:'https://console.groq.com/keys',configured:false,model:'openai/gpt-oss-120b'},
      {id:'together',name:'Together AI',region:'Global',models:['Qwen 3.8 Next','Llama 4 Maverick','DeepSeek V3'],base:'https://api.together.xyz/v1',key:'https://api.together.ai/settings/api-keys',configured:false,model:'Qwen/Qwen3.8-Next-80B-A3B-Instruct'},
      {id:'hunyuan',name:'腾讯混元 TokenHub',region:'CN',models:['Hy4 Preview','Hy3','DeepSeek V4 Pro'],base:'https://api.lkeap.cloud.tencent.com/plan/v3',key:'https://console.cloud.tencent.com/tokenhub/codingplan',configured:false,model:'hy4-preview'},
      {id:'volcengine',name:'火山引擎 / 豆包',region:'CN',models:['Ark Code Latest','Doubao Seed 2.0 Pro','DeepSeek V4 Flash'],base:'https://ark.cn-beijing.volces.com/api/coding/v3',key:'https://console.volcengine.com/ark/region:ark+cn-beijing/apiKey',configured:false,model:'ark-code-latest'},
      {id:'openrouter',name:'OpenRouter',region:'Global',models:['多模型路由','Claude Opus 5','GPT-5.6 Sol'],base:'https://openrouter.ai/api/v1',key:'https://openrouter.ai/settings/keys',configured:false,model:'anthropic/claude-opus-5'}
    ];
    const activities=[['今天 14:32','ai-coding','API key','OpenAI','更新 API Key'],['今天 11:21','personal','TOKEN','Anthropic','复制'],['今天 09:17','side-project','API key','Google Gemini','新建密钥'],['昨天 22:08','work','Password','GitHub','查看'],['昨天 19:54','research','URL','智谱 GLM','复制'],['昨天 16:11','ai-tools','API key','DeepSeek','查看']];
    const state={view:'providers',query:'',region:'all',selected:'openai',tab:'overview',modal:null,toast:'',selectedRows:[]};
    const provider=()=>providers.find(p=>p.id===state.selected)||providers[0];
    const esc=(s)=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const icons={all:'squares-four',api_key:'key',token:'fingerprint-simple',url:'link',password:'lock-key',text:'note',profiles:'stack',projects:'folder-simple',providers:'buildings',settings:'gear'};
    function sidebar(){return `<aside class="sidebar"><div class="brand"><div class="brand-mark">SH</div><div><strong>SecretHub</strong><small>Command Orbit</small></div></div><nav class="nav">${nav('全部','all','48')}${nav('API key','api_key','22')}${nav('TOKEN','token','9')}${nav('URL','url','7')}${nav('Password','password','4')}${nav('Text','text','6')}<div class="nav-label">管理</div>${nav('配置组合','profiles','6')}${nav('项目','projects','12')}${nav('服务商','providers','36')}</nav><div class="sidebar-bottom"><button class="nav-btn" data-nav="settings"><i class="ph ph-gear nav-icon"></i>设置</button><div class="vault-card"><span class="vault-dot"></span>本地优先<strong>加密已启用</strong><span>所有数据仅保存在此设备</span></div></div></aside>`}
    function nav(label,id,count){return `<button class="nav-btn ${state.view===id?'active':''}" data-nav="${id}"><i class="ph ph-${icons[id]} nav-icon"></i>${label}${count?`<span class="nav-count">${count}</span>`:''}</button>`}
    function topbar(title,sub){return `<header class="topbar"><div><div class="eyebrow">LOCAL-FIRST / AI-SAFE</div><h1>${title}</h1><p class="subtitle">${sub}</p></div><div class="top-actions"><button class="btn ghost" data-action="language">中文 / EN</button><button class="btn" data-action="import">导入</button><button class="btn primary" data-action="add">＋ 新建密钥</button></div></header>`}
    function summary(){return `<div class="summary"><div class="summary-item"><small>密钥总数</small><strong>48</strong></div><div class="summary-item"><small>服务商</small><strong>36</strong></div><div class="summary-item"><small>项目</small><strong>12</strong></div><div class="summary-item"><small>已验证</small><strong class="green">31</strong></div></div>`}
    function providerView(){const q=state.query.toLowerCase();const rows=providers.filter(p=>(state.region==='all'||p.region.includes(state.region))&&(`${p.name} ${p.region} ${p.models.join(' ')}`.toLowerCase().includes(q)));return `<main class="main">${topbar('你的 AI 开发密钥中枢','集中管理 · 快速访问 · 安全可控')}${summary()}<section class="section"><div class="section-head"><div><div class="kicker">DIRECTORY / ${rows.length.toString().padStart(2,'0')}</div><h2>服务商</h2><p>集成主流 AI 服务商，统一管理模型、请求地址与密钥。</p></div><div class="section-tools"><input id="provider-search" value="${esc(state.query)}" placeholder="搜索服务商..."/><select id="region-filter"><option value="all">全部区域</option><option value="CN" ${state.region==='CN'?'selected':''}>中国大陆</option><option value="Global" ${state.region==='Global'?'selected':''}>海外</option></select></div></div><div class="provider-grid">${rows.length?rows.map(card).join(''):`<div class="empty">没有匹配的服务商</div>`}</div><div class="provider-footer"><span>${rows.length} 个服务商 · ${providers.reduce((n,p)=>n+p.models.length,0)} 个模板</span><span>模型目录支持自定义 ID</span></div></section><section class="activity"><div class="section-head"><div><div class="kicker">ACTIVITY / RECENT</div><h2>最近项目活动</h2><p>你最近访问和更新的密钥。</p></div><button class="btn ghost" data-action="all-activity">查看全部 →</button></div><table><thead><tr><th>时间</th><th>项目</th><th>类型</th><th>服务商</th><th>操作</th></tr></thead><tbody>${activities.map(row).join('')}</tbody></table></section></main><div class="bottom-bar"><span>${state.selectedRows.length?`已选择 ${state.selectedRows.length} 个服务商`:'选择服务商后可批量导出'}</span><div class="bottom-actions"><button class="btn" data-action="select-all">选择全部</button><button class="btn primary" data-action="export">导出到 .env</button></div></div>`}
    function card(p){return `<article class="provider-card ${p.id===state.selected?'selected':''}" data-provider-card="${p.id}"><input type="checkbox" data-provider-check="${p.id}" ${state.selectedRows.includes(p.id)?'checked':''} aria-label="选择 ${esc(p.name)}"/><div class="provider-copy"><strong>${esc(p.name)}</strong><small>${esc(p.region)} · ${p.models.length} 个模型</small><div class="model-tags">${p.models.map(m=>`<span class="model-tag">${esc(m)}</span>`).join('')}</div><div class="provider-endpoint">${esc(p.base)}</div></div><div class="provider-actions"><span class="status-dot ${p.configured?'configured':''}" title="${p.configured?'已配置':'未配置'}"></span><button class="btn" data-config="${p.id}">配置</button><a href="${esc(p.key)}" data-official="${p.id}">官网 ↗</a></div></article>`}
    function row(r){return `<tr><td class="muted">${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td class="link">${r[4]}</td></tr>`}
    function credentialsView(){return `<main class="main view-panel">${topbar('凭据目录','按类型、服务商和项目快速找到可用凭据。')}<section class="section"><div class="section-head"><div><div class="kicker">CATALOG / 48</div><h2>全部凭据</h2><p>当前原型用真实结构演示列表、详情和导出状态。</p></div><button class="btn primary" data-action="add">＋ 新建密钥</button></div><div class="project-row"><div><strong>OpenAI API Key <span class="profile-chip">API key</span></strong><small>OPENAI_API_KEY · 已验证 · 最近输出 12 次</small></div><button class="btn" data-action="copy">复制</button></div><div class="project-row"><div><strong>DeepSeek V4 Flash <span class="profile-chip">API key</span></strong><small>DEEPSEEK_API_KEY · 待验证 · 最近输出 4 次</small></div><button class="btn" data-action="copy">复制</button></div><div class="project-row"><div><strong>项目服务地址 <span class="profile-chip">URL</span></strong><small>OPENAI_BASE_URL · 手动维护</small></div><button class="btn" data-action="copy">复制</button></div></section></main>`}
    function projectsView(){return `<main class="main view-panel">${topbar('项目活动','只显示通过 SecretHub 导入或导出的项目，按最近使用排序。')}<section class="section"><div class="section-head"><div><div class="kicker">PROJECTS / 12</div><h2>最近项目</h2><p>项目目录和 Env 变更都保留在本机。</p></div><button class="btn primary" data-action="import-project">＋ 导入项目 Env</button></div>${['ai-coding','side-project','creator-os','workbench'].map((p,i)=>`<div class="project-row"><div><strong>${p}</strong><small>F:\\CCPJ\\${p} · ${i+3} 个环境变量 · ${i?'昨天':'今天'} 更新</small></div><div class="bottom-actions"><button class="btn" data-action="open-project">打开文件夹 ↗</button><button class="btn primary" data-action="edit-env">编辑 .env</button></div></div>`).join('')}</section></main>`}
    function profilesView(){return `<main class="main view-panel">${topbar('配置组合','组合只保存凭据 ID，应用时自动解析最新值。')}<section class="section"><div class="section-head"><div><div class="kicker">PROFILES / 06</div><h2>配置组合</h2><p>把一组凭据作为项目配方重复使用。</p></div><button class="btn primary" data-action="new-profile">＋ 新建组合</button></div>${['AI Standard','Web Stack','Local Dev'].map((p,i)=>`<div class="project-row"><div><strong>${p}</strong><small>${i+2} 个凭据 · 最近应用 ${i+1} 次</small></div><div class="bottom-actions"><button class="btn" data-action="edit-profile">编辑</button><button class="btn primary" data-action="apply-profile">应用</button></div></div>`).join('')}</section></main>`}
    function inspector(){const p=provider();return `<aside class="inspector"><div class="inspector-head"><div><div class="kicker">CREDENTIAL DETAIL</div><h2>${esc(p.name)}</h2><p class="inspector-sub">${esc(p.region)} · ${p.configured?'已配置':'待配置'}</p></div><button class="close-button" data-action="close-detail" aria-label="关闭详情">×</button></div><div class="detail-hero"><strong>${esc(p.name)} API Key</strong><span>${esc(p.models[0])} · ${esc(p.base)}</span><span class="detail-status"><i class="status-dot ${p.configured?'configured':''}"></i>${p.configured?'连接正常':'等待配置'}</span></div><div class="detail-tabs">${tab('overview','详情')}${tab('usage','使用记录')}${tab('projects','关联项目')}</div>${state.tab==='overview'?detailOverview(p):`<div class="empty">${state.tab==='usage'?'这里会显示复制、验证和 Env 输出记录。':'这里会显示使用该凭据的项目。'}</div>`}</aside>`}
    function tab(id,label){return `<button class="detail-tab ${state.tab===id?'active':''}" data-tab="${id}">${label}</button>`}
    function detailOverview(p){return `<div class="detail-list"><div class="detail-row"><label>名称</label><strong>${esc(p.name)} API Key</strong></div><div class="detail-row"><label>模型</label><strong>${esc(p.model)}</strong></div><div class="detail-row"><label>环境变量</label><strong>全局 · ${p.id.toUpperCase()}_API_KEY</strong></div><div class="detail-row"><label>密钥值</label><strong class="masked">sk-•••••••••••••••••••••w8f2</strong></div><div class="detail-row"><label>请求地址</label><strong>${esc(p.base)}</strong></div><div class="detail-actions"><button class="btn" data-action="copy-key">复制密钥</button><button class="btn" data-action="copy-all">复制全部</button><button class="btn primary wide" data-action="export-selected">导出到 .env</button><button class="btn wide" data-config="${p.id}">编辑凭据配置</button></div></div><div class="safe-box">◆ 安全提示<br/>API Key 只保存在本地加密保险库，不进入浏览器存储、日志或 AI 上下文。</div><div class="quick-env"><h3>快速使用</h3><code>${p.id.toUpperCase()}_API_KEY=sk-••••••••••••<br/>${p.id.toUpperCase()}_MODEL=${esc(p.model)}<br/>${p.id.toUpperCase()}_BASE_URL=${esc(p.base)}</code></div>`}
    function modal(){if(!state.modal)return '';const p=providers.find(x=>x.id===state.modal)||providers[0];return `<div class="modal-backdrop"><form class="modal config-form" id="config-form"><div class="modal-head"><div><div class="kicker">CONFIG / ${esc(p.name)}</div><h2>配置服务商</h2><p>修改模型、请求地址并安全保存 API Key。</p></div><button type="button" class="close-button" data-action="close-modal">×</button></div><label>模型<select name="model">${p.models.map((m,i)=>`<option value="${esc(m)}" ${i===0?'selected':''}>${esc(m)}</option>`).join('')}<option value="custom">自定义模型 ID</option></select></label><label>请求地址<input name="base" value="${esc(p.base)}" required/></label><label>API Key<input name="key" type="password" placeholder="只在本机填写" autocomplete="new-password"/></label><label>备注<textarea name="note" rows="3" placeholder="用途、项目或轮换说明"></textarea></label><div class="safe-box">保存后模型名称和请求地址可直接输出到项目 .env。</div><div class="modal-foot"><button type="button" class="btn" data-action="close-modal">取消</button><button class="btn primary" type="submit">保存配置</button></div></form></div>`}
    function render(){document.getElementById('app').innerHTML=`<div class="app">${sidebar()}${state.view==='providers'?providerView():state.view==='projects'?projectsView():state.view==='profiles'?profilesView():credentialsView()}${state.view==='providers'?inspector():''}${modal()}${state.toast?`<div class="toast">${esc(state.toast)}</div>`:''}</div>`;bindFocus()}
    function bindFocus(){const input=document.getElementById('provider-search');if(input){input.focus();input.setSelectionRange(input.value.length,input.value.length)}}
    function toast(message){state.toast=message;render();window.clearTimeout(window.__toast);window.__toast=window.setTimeout(()=>{state.toast='';render()},2200)}
    document.addEventListener('click',(event)=>{const target=event.target.closest('[data-nav],[data-action],[data-config],[data-provider-card],[data-tab],[data-official]');if(!target)return;if(target.dataset.nav){state.view=target.dataset.nav;state.tab='overview';render();return}if(target.dataset.tab){state.tab=target.dataset.tab;render();return}if(target.dataset.providerCard&&!target.dataset.config){state.selected=target.dataset.providerCard;state.tab='overview';render();return}if(target.dataset.config){event.preventDefault();event.stopPropagation();state.selected=target.dataset.config;state.modal=target.dataset.config;render();return}if(target.dataset.official){event.preventDefault();window.open(target.href,'_blank','noopener,noreferrer');return}const action=target.dataset.action;if(action==='close-detail'){state.selected='';render()}else if(action==='close-modal'){state.modal=null;render()}else if(action==='copy-key'){toast('API Key 已复制')}else if(action==='copy-all'){toast('Env 内容已复制')}else if(action==='export'||action==='export-selected'){toast('已导出到 .env')}else if(action==='select-all'){state.selectedRows=providers.map(p=>p.id);render()}else if(action==='add'||action==='new-profile'||action==='import'||action==='import-project'||action==='edit-env'||action==='edit-profile'){toast('原型交互：下一步流程已打开')}else if(action==='apply-profile'){toast('组合已应用到导出流程')}else if(action==='open-project'){toast('已尝试打开项目文件夹')}else if(action==='language'){toast('语言切换入口已保留')}else if(action==='all-activity'){toast('已进入完整活动记录')}});
    document.addEventListener('change',(event)=>{if(event.target.id==='region-filter'){state.region=event.target.value;render()}if(event.target.matches('[data-provider-check]')){const id=event.target.dataset.providerCheck;state.selectedRows=event.target.checked?[...state.selectedRows,id]:state.selectedRows.filter(x=>x!==id);render()}});
    document.addEventListener('input',(event)=>{if(event.target.id==='provider-search'){state.query=event.target.value;const grid=document.querySelector('.provider-grid');if(grid){const q=state.query.toLowerCase();grid.innerHTML=providers.filter(p=>(state.region==='all'||p.region.includes(state.region))&&(`${p.name} ${p.region} ${p.models.join(' ')}`.toLowerCase().includes(q))).map(card).join('')}}});
    document.addEventListener('submit',(event)=>{if(event.target.id==='config-form'){event.preventDefault();const p=provider();const form=new FormData(event.target);p.base=form.get('base');p.model=form.get('model')==='custom'?'custom-model':form.get('model');p.configured=true;state.modal=null;toast('服务商配置已保存')}});
    render();
  </script>
</body>
</html>
