<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SecretHub · Operations Prototype</title>
  <style>
    :root{--bg:#0b1110;--panel:#111a18;--panel2:#15221e;--line:#29403a;--muted:#78928a;--text:#e4f0eb;--soft:#b1c9c0;--accent:#9fe0c0;--accent2:#d6b673;--danger:#d99592;--shadow:0 24px 70px #0008}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 76% 0,#244a3a44,transparent 35%),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:13px}button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}.app{min-height:100vh;display:grid;grid-template-columns:235px 1fr}.sidebar{padding:28px 14px 18px;border-right:1px solid var(--line);background:#0b1211e8;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:12px;padding:0 10px 30px}.brand-mark{width:30px;height:30px;border:1px solid var(--accent);border-radius:50%;display:grid;place-items:center;box-shadow:0 0 0 7px #9fe0c00d}.brand-mark:after{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}.brand strong{display:block;font-size:16px;letter-spacing:-.03em}.brand small{display:block;color:var(--muted);font-size:9px;letter-spacing:.13em;text-transform:uppercase;margin-top:4px}.nav{display:grid;gap:4px}.nav-label{margin:22px 10px 6px;color:#5e7770;font-size:10px;letter-spacing:.14em;text-transform:uppercase}.nav-btn{display:flex;align-items:center;gap:10px;width:100%;padding:10px 11px;border:1px solid transparent;border-radius:8px;background:transparent;color:#94ada4;text-align:left}.nav-btn:hover,.nav-btn.active{background:#1c332c;border-color:#315549;color:var(--text)}.nav-btn .glyph{width:14px;color:#7cae9a;text-align:center}.nav-btn .count{margin-left:auto;color:#6c8e82;font-size:11px}.sidebar-bottom{margin-top:auto}.vault-pill{border-top:1px solid var(--line);margin-top:15px;padding:16px 10px 0;color:var(--muted);font-size:11px}.vault-pill b{display:block;color:var(--accent);font-size:10px;margin-top:5px}.main{padding:28px 40px 20px;min-width:0}.topbar,.content{max-width:1260px;margin:0 auto}.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:24px}.eyebrow,.kicker{color:#71a28e;font-size:10px;letter-spacing:.16em;text-transform:uppercase}.topbar h1{margin:9px 0 4px;font-size:30px;letter-spacing:-.05em}.subtitle{color:var(--muted);margin:0;line-height:1.6}.top-actions{display:flex;gap:9px;align-items:center}.btn{border:1px solid var(--line);background:#14201d;color:var(--soft);border-radius:7px;padding:9px 13px}.btn:hover{background:#1e3830;color:var(--text);border-color:#4c7765}.btn.primary{background:var(--accent);border-color:var(--accent);color:#12231c;font-weight:700}.btn.primary:hover{background:#b9efd5}.btn.danger{color:var(--danger);border-color:#694342;background:#211716}.security{display:flex;gap:13px;align-items:center;margin:28px auto 22px;padding:11px 14px;border:1px solid #315548;background:#16302799;border-radius:7px;color:#94b4a7;font-size:11px}.security i{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 5px #9fe0c013}.divider{width:1px;height:14px;background:#38564a}.toolbar{display:flex;justify-content:space-between;gap:14px;margin-bottom:15px}.search{display:flex;align-items:center;gap:9px;max-width:460px;flex:1;padding:0 12px;border:1px solid var(--line);border-radius:7px;background:#101917;color:#719188}.search input{width:100%;padding:11px 0;border:0;outline:0;background:transparent;color:var(--text)}.filters{display:flex;gap:7px}.filters select,.filter-btn{border:1px solid var(--line);background:#111b19;color:#8da89f;border-radius:6px;padding:8px 9px;font-size:11px}.filter-btn.active{border-color:#659b81;background:#1d382d;color:var(--accent)}.workspace{display:grid;grid-template-columns:1.08fr .92fr;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#101817d9;min-height:590px}.list-panel{border-right:1px solid var(--line)}.panel-head,.detail-head{display:flex;justify-content:space-between;align-items:center;padding:23px}.panel-head h2,.detail-head h2,.page-head h2{margin:7px 0 0;font-size:19px;letter-spacing:-.04em}.secret-list{border-top:1px solid #20322d}.secret{display:grid;grid-template-columns:20px 34px minmax(0,1fr) 8px 18px;gap:11px;align-items:center;padding:15px 23px;border-bottom:1px solid #1f2e2a}.secret:hover,.secret.selected{background:#193027}.secret input{accent-color:var(--accent)}.avatar{width:31px;height:31px;border:1px solid #456457;border-radius:8px;display:grid;place-items:center;color:var(--accent);background:#1c3028}.secret b,.secret span,.secret small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.secret b{font-size:12px}.secret span{margin-top:4px;color:#8bb0a1;font:11px ui-monospace,Consolas,monospace}.secret small{margin-top:4px;color:#617d73;font-size:10px}.status{width:7px;height:7px;border-radius:50%;background:var(--accent)}.status.warn{background:var(--accent2)}.star{color:var(--accent2)}.detail{background:radial-gradient(circle at 50% 17%,#39715b1c,transparent 46%)}.hero-card{margin:5px 23px 25px;padding:18px;border:1px solid #3a5c4e;border-radius:9px;background:linear-gradient(120deg,#214638aa,#101b18aa);display:grid;grid-template-columns:42px 1fr auto;gap:13px;align-items:center}.orb{width:41px;height:41px;border:1px solid var(--accent);border-radius:50%;display:grid;place-items:center}.orb:after{content:"";width:12px;height:12px;border:1px solid var(--accent);transform:rotate(45deg);border-radius:4px}.field-label{display:block;color:#6d8b81;font-size:10px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:6px}.mono{font:12px ui-monospace,Consolas,monospace;color:#d0e7dc}.masked{display:block;margin-top:6px;color:#83aa9b;font:12px ui-monospace,Consolas,monospace}.badge{padding:5px 9px;border:1px solid #477c60;background:#153527;border-radius:999px;color:var(--accent);font-size:10px}.detail-fields{display:grid;gap:21px;padding:0 23px 25px;border-bottom:1px solid var(--line)}.detail-actions{display:flex;flex-wrap:wrap;gap:8px;padding:18px 23px}.detail-links{display:grid;gap:6px;padding:0 23px}.detail-links a{color:var(--accent);font-size:11px}.footer{display:flex;justify-content:space-between;color:#607a71;font-size:10px;max-width:1260px;margin:17px auto 0}.page{border:1px solid var(--line);border-radius:10px;background:#101817d9;min-height:625px;padding:26px}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:25px}.page-head p{color:var(--muted);line-height:1.6;max-width:680px}.card-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{border:1px solid var(--line);background:#15221f;border-radius:8px;padding:17px;text-align:left}.card:hover,.card.selected{border-color:#75ae92;background:#1c352c}.card h3{margin:0 0 7px;font-size:14px}.card p,.card small{color:var(--muted);font-size:11px;margin:0;line-height:1.6}.card .card-foot{display:flex;justify-content:space-between;align-items:center;margin-top:17px;color:var(--accent);font-size:10px}.provider-layout{display:grid;grid-template-columns:230px 1fr;gap:20px}.provider-list{display:grid;gap:7px}.provider-item{padding:12px;border:1px solid var(--line);border-radius:7px;background:#121e1b;color:#aac2b8;text-align:left}.provider-item.active{background:#244438;border-color:#6aa487;color:var(--text)}.model-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.model-card{border:1px solid var(--line);border-radius:8px;padding:16px;background:#15221f}.model-card h3{margin:0 0 7px}.model-card .model-id{color:var(--accent);font:11px ui-monospace,Consolas,monospace}.model-card .url{display:block;color:var(--muted);margin-top:12px;font-size:10px;word-break:break-all}.model-card footer{display:flex;justify-content:flex-end;gap:7px;margin-top:15px}.project-list{display:grid;gap:9px}.project-row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:16px;padding:16px;border:1px solid var(--line);border-radius:8px;background:#15221f}.project-row h3{margin:0 0 6px}.project-row p{margin:0;color:var(--muted);font:11px ui-monospace,Consolas,monospace}.project-row time{color:#8eafa2;font-size:10px}.env-editor{display:grid;grid-template-columns:1fr 1.3fr auto;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden}.env-editor>div{padding:12px;border-bottom:1px solid #273d35}.env-editor input{width:100%;border:1px solid transparent;background:transparent;color:var(--text);padding:7px;border-radius:5px}.env-editor input:focus{border-color:#568875;background:#0f1916;outline:0}.env-head{background:#193128;color:#9dc8b4;font-size:10px;letter-spacing:.1em;text-transform:uppercase}.env-remove{color:var(--danger);background:transparent;border:0}.modal{position:fixed;inset:0;background:#030706b8;display:grid;place-items:center;z-index:5}.dialog{width:min(600px,calc(100vw - 44px));max-height:calc(100vh - 44px);overflow:auto;border:1px solid #4d7763;border-radius:10px;background:#111d1a;box-shadow:var(--shadow);padding:25px}.dialog.small{width:min(430px,calc(100vw - 44px))}.dialog-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px}.dialog-head h2{margin:7px 0 0;font-size:20px}.dialog-head p{color:var(--muted);font-size:11px;line-height:1.5}.close{border:0;background:transparent;color:#9eb5ad;font-size:20px}.form-grid{display:grid;gap:14px}.form-grid label{display:grid;gap:6px;color:#8eaba1;font-size:11px}.form-grid input,.form-grid textarea,.form-grid select{border:1px solid var(--line);border-radius:6px;background:#0d1614;color:var(--text);padding:10px;outline:0}.form-grid input:focus,.form-grid textarea:focus,.form-grid select:focus{border-color:#77ad91}.dialog-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}.toast{position:fixed;right:24px;bottom:22px;background:#1f4032;border:1px solid #6ca987;color:#d7f1e3;padding:12px 15px;border-radius:7px;box-shadow:var(--shadow);z-index:8}.toast.error{background:#402322;border-color:#a96561}.hidden{display:none!important}.chip{display:inline-flex;padding:5px 8px;border-radius:999px;border:1px solid var(--line);color:#9fc0b3;background:#162721;font-size:10px}
    @media(max-width:1050px){.app{grid-template-columns:205px 1fr}.main{padding:24px}.workspace{grid-template-columns:1fr}.list-panel{border-right:0;border-bottom:1px solid var(--line)}.card-grid{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    const state={
      view:'all', search:'', selected:'openai', toast:'', toastError:false, modal:null,
      secrets:[
        {id:'openai',name:'OpenAI Main',type:'API key',provider:'OpenAI',env:'OPENAI_API_KEY',value:'fixture-openai-key',model:'gpt-5.5',modelEnv:'OPENAI_MODEL',url:'https://api.openai.com/v1',urlEnv:'OPENAI_BASE_URL',tags:['ai','production'],note:'本地开发环境主凭据',favorite:true},
        {id:'deepseek',name:'DeepSeek Lab',type:'API key',provider:'DeepSeek',env:'DEEPSEEK_API_KEY',value:'fixture-deepseek-key',model:'deepseek-chat',modelEnv:'DEEPSEEK_MODEL',url:'https://api.deepseek.com',urlEnv:'DEEPSEEK_BASE_URL',tags:['ai','research'],note:'低成本验证环境',favorite:false},
        {id:'github',name:'GitHub Build',type:'TOKEN',provider:'GitHub',env:'GITHUB_TOKEN',value:'fixture-github-token',model:'',modelEnv:'',url:'',urlEnv:'',tags:['ci'],note:'构建机器人 Token',favorite:false},
        {id:'supabase',name:'CueCut Database',type:'URL',provider:'Supabase',env:'SUPABASE_URL',value:'https://example.invalid/project',model:'',modelEnv:'',url:'',urlEnv:'',tags:['database'],note:'演示地址，不可访问',favorite:true},
        {id:'db-password',name:'Local Database',type:'Password',provider:'Generic',env:'DATABASE_PASSWORD',value:'fixture-db-password',model:'',modelEnv:'',url:'',urlEnv:'',tags:['database'],note:'仅用于测试',favorite:false},
        {id:'plain-note',name:'Deployment Note',type:'Text',provider:'Generic',env:'',value:'fixture text value',model:'',modelEnv:'',url:'',urlEnv:'',tags:['notes'],note:'不写入项目环境',favorite:false}
      ],
      providers:[
        {id:'OpenAI',name:'OpenAI',region:'Global',models:[['GPT-5.5','gpt-5.5'],['GPT-4.1','gpt-4.1'],['GPT-4o','gpt-4o']],url:'https://api.openai.com/v1',key:'https://platform.openai.com/api-keys'},
        {id:'Anthropic',name:'Anthropic',region:'Global',models:[['Claude Opus','claude-opus-4-1'],['Claude Sonnet','claude-sonnet-4-0']],url:'https://api.anthropic.com',key:'https://console.anthropic.com/settings/keys'},
        {id:'DeepSeek',name:'DeepSeek',region:'CN',models:[['DeepSeek Chat','deepseek-chat'],['DeepSeek Reasoner','deepseek-reasoner']],url:'https://api.deepseek.com',key:'https://platform.deepseek.com/api_keys'},
        {id:'Qwen',name:'通义千问 / Qwen',region:'CN',models:[['Qwen Plus','qwen-plus'],['Qwen Turbo','qwen-turbo'],['Qwen Max','qwen-max']],url:'https://dashscope.aliyuncs.com/compatible-mode/v1',key:'https://bailian.console.aliyun.com/'},
        {id:'Gemini',name:'Google Gemini',region:'Global',models:[['Gemini 2.5 Pro','gemini-2.5-pro'],['Gemini 2.5 Flash','gemini-2.5-flash']],url:'https://generativelanguage.googleapis.com/v1beta/openai',key:'https://aistudio.google.com/apikey'},
        {id:'GLM',name:'智谱 GLM',region:'CN',models:[['GLM-4.5','glm-4.5'],['GLM-4 Flash','glm-4-flash']],url:'https://open.bigmodel.cn/api/paas/v4',key:'https://bigmodel.cn/usercenter/apikeys'}
      ],
      projects:[
        {name:'SecretHub',path:'F:/CCPJ/SecretHub',when:'刚刚',entries:6},
        {name:'CueCut',path:'F:/CCPJ/CueCut3',when:'2 小时前',entries:4},
        {name:'Creator OS',path:'F:/CCPJ/自媒体工作台GPT版',when:'昨天',entries:8}
      ],
      profiles:[{id:'p1',name:'AI Standard',description:'主流 AI 开发环境',ids:['openai','deepseek']},{id:'p2',name:'Web Stack',description:'网站与数据库环境',ids:['openai','supabase']}]
    };
    const $=s=>document.querySelector(s);
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function toast(message,error=false){state.toast=message;state.toastError=error;render();setTimeout(()=>{state.toast='';render()},2800)}
    function currentSecret(){return state.secrets.find(x=>x.id===state.selected)||state.secrets[0]}
    function nav(label,view,icon,count=''){return `<button class="nav-btn ${state.view===view?'active':''}" data-nav="${view}"><span class="glyph">${icon}</span>${label}${count?`<span class="count">${count}</span>`:''}</button>`}
    function sidebar(){return `<aside class="sidebar"><div class="brand"><div class="brand-mark"></div><div><strong>SecretHub</strong><small>Developer Vault</small></div></div><nav class="nav">${nav('全部','all','◆',state.secrets.length)}${nav('API key','API key','·')}${nav('TOKEN','TOKEN','·')}${nav('URL','URL','·')}${nav('Password','Password','·')}${nav('Text','Text','·')}<p class="nav-label">管理</p>${nav('配置组合','profiles','·')}${nav('项目','projects','·')}${nav('服务商','providers','·')}</nav><div class="sidebar-bottom"><button class="nav-btn" data-nav="settings"><span class="glyph">/</span>设置</button><button class="nav-btn" data-action="audit"><span class="glyph">·</span>操作审计</button><div class="vault-pill">● 本地保险库<b>已保护 · 原型数据</b></div></div></aside>`}
    function header(title,subtitle,action=''){return `<div class="page-head"><div><div class="kicker">LOCAL-FIRST / PROTOTYPE</div><h2>${title}</h2><p>${subtitle}</p></div>${action}</div>`}
    function allView(){const q=state.search.toLowerCase();const rows=state.secrets.filter(x=>(state.view==='all'||x.type===state.view)&&(`${x.name} ${x.provider} ${x.env} ${x.tags.join(' ')}`.toLowerCase().includes(q)));const s=currentSecret();return `<div class="content"><div class="security"><i></i><span>本地数据流</span><span class="divider"></span><span>加密保险库</span><span class="divider"></span><span>原型交互不写入真实数据</span></div><div class="toolbar"><label class="search">⌕<input id="search" value="${esc(state.search)}" placeholder="搜索凭据、Provider 或标签" /></label><div class="filters"><button class="filter-btn" data-action="select-all">${rows.length&&rows.every(x=>x.selected)?'取消全选':'全选当前结果'}</button><span class="chip">${rows.length} 条结果</span></div></div><div class="workspace"><section class="list-panel"><div class="panel-head"><div><div class="kicker">CATALOG / ${String(rows.length).padStart(2,'0')}</div><h2>凭据目录</h2></div><button class="btn primary" data-action="add-secret">＋ 添加凭据</button></div><div class="secret-list">${rows.map(x=>`<article class="secret ${x.id===s.id?'selected':''}"><input type="checkbox" data-secret-check="${x.id}" ${x.selected?'checked':''}/><div class="avatar">${x.provider[0]}</div><div data-select-secret="${x.id}"><b>${esc(x.name)}</b><span>${esc(x.env||'无环境变量')}</span><small>${esc(x.provider)} · ${esc(x.type)}</small></div><i class="status ${x.type==='URL'?'warn':''}"></i>${x.favorite?'<span class="star">★</span>':'<span></span>'}</article>`).join('')}</div></section><section class="detail"><div class="detail-head"><div><div class="kicker">DETAIL / ${esc(s.type)}</div><h2>${esc(s.name)}</h2></div><button class="btn" data-action="edit-secret">编辑</button></div><div class="hero-card"><div class="orb"></div><div><span class="field-label">${esc(s.env||'无环境变量')}</span><strong class="mono">${esc(s.env||'—')}</strong><span class="masked">••••••••••••••••</span></div><span class="badge">${s.type==='API key'?'待验证':'已保护'}</span></div><div class="detail-fields"><div><span class="field-label">Provider</span><strong>${esc(s.provider)}</strong></div><div><span class="field-label">模型</span><strong>${esc(s.model||'不适用')}</strong></div><div><span class="field-label">备注</span><strong>${esc(s.note||'—')}</strong></div><div><span class="field-label">标签</span><div>${s.tags.map(t=>`<span class="chip">${esc(t)}</span>`).join(' ')||'—'}</div></div></div><div class="detail-links">${s.url?`<a href="${esc(s.url)}" target="_blank" rel="noreferrer">请求地址：${esc(s.url)} ↗</a>`:''}</div><div class="detail-actions"><button class="btn" data-action="copy-api">复制 API Key</button><button class="btn" data-action="copy-env">复制项目 Env</button><button class="btn" data-action="validate">一键验证</button></div></section></div><div class="footer"><span>SecretHub / Prototype 0.1</span><span>当前视图：${esc(state.view)}</span></div></div>`}
    function providersView(){const p=state.providers.find(x=>x.id===state.provider)||state.providers[0];state.provider=p.id;return `<div class="content"><div class="page">${header('服务商模型中心','在这里管理 Provider 的默认模型、请求地址和 API Key。修改只作用于原型内存数据。','<button class="btn primary" data-action="add-model">＋ 增加模型</button>')}<div class="provider-layout"><div class="provider-list">${state.providers.map(x=>`<button class="provider-item ${x.id===p.id?'active':''}" data-provider="${x.id}"><b>${esc(x.name)}</b><small>${esc(x.region)} · ${x.models.length} models</small></button>`).join('')}</div><div><div class="panel-head" style="padding:0 0 17px"><div><div class="kicker">PROVIDER / ${esc(p.region)}</div><h2>${esc(p.name)}</h2></div><a class="btn" href="${esc(p.key)}" target="_blank" rel="noreferrer" data-external>官网 API Key ↗</a></div><div class="model-grid">${p.models.map((m,i)=>`<article class="model-card"><h3>${esc(m[0])}</h3><span class="model-id">${esc(m[1])}</span><span class="url">${esc(p.url)}</span><footer><button class="btn" data-action="edit-model" data-model-index="${i}">编辑默认配置</button></footer></article>`).join('')}</div></div></div></div></div>`}
    function projectsView(){return `<div class="content"><div class="page">${header('项目','只显示通过 SecretHub 导入/导出的项目，按最近使用排序。点击可快速打开文件夹。','<button class="btn primary" data-action="project-import">＋ 导入项目 Env</button>')}<div class="project-list">${state.projects.map((p,i)=>`<article class="project-row"><div><h3>${esc(p.name)}</h3><p>${esc(p.path)}</p><span class="chip">${p.entries} 个 Env 条目</span></div><div><time>${esc(p.when)}</time><button class="btn" data-action="open-project" data-project-index="${i}">打开文件夹 ↗</button><button class="btn primary" data-action="edit-env" data-project-index="${i}">编辑 .env</button></div></article>`).join('')}</div></div></div>`}
    function profilesView(){return `<div class="content"><div class="page">${header('配置组合','组合只保存凭据 ID，应用时自动解析最新值。','<button class="btn primary" data-action="new-profile">＋ 新建组合</button>')}<div class="card-grid">${state.profiles.map((p,i)=>`<article class="card"><h3>${esc(p.name)}</h3><p>${esc(p.description)}</p><div class="card-foot"><span>${p.ids.length} 个凭据</span><span><button class="btn" data-action="edit-profile" data-profile-index="${i}">编辑</button><button class="btn primary" data-action="apply-profile" data-profile-index="${i}">应用</button></span></div></article>`).join('')}</div></div></div>`}
    function settingsView(){return `<div class="content"><div class="page">${header('设置','原型设置页，后续可接入真实保险库配置。')}<div class="card-grid"><article class="card"><h3>安全策略</h3><p>自动锁定 · 15 分钟<br/>复制后自动清除 · 30 秒</p></article><article class="card"><h3>显示语言</h3><p>中文（默认） / English<br/>当前：中文</p></article><article class="card"><h3>数据边界</h3><p>API Key 永不进入 AI 上下文<br/>项目导出仅输出 Env 投影</p></article></div></div></div>`}
    function modal(){if(!state.modal)return '';const m=state.modal;if(m.kind==='model')return `<div class="modal"><form class="dialog" id="model-form"><div class="dialog-head"><div><div class="kicker">MODEL CONFIG / DRAFT</div><h2>${m.index===null?'增加模型':'编辑默认配置'}</h2><p>模型 ID、请求地址和 API Key 都是该 Provider 的专属配置。</p></div><button class="close" type="button" data-action="close-modal">×</button></div><div class="form-grid"><label>模型名称<input name="name" value="${esc(m.name)}" required /></label><label>模型 ID<input name="id" value="${esc(m.id)}" required /></label><label>请求地址<input name="url" value="${esc(m.url)}" required /></label><label>API Key<input name="key" type="password" placeholder="只在本机填写，不进入原型数据" /></label></div><div class="dialog-foot"><button class="btn" type="button" data-action="close-modal">取消</button><button class="btn primary">保存模型配置</button></div></form></div>`;if(m.kind==='env')return `<div class="modal"><div class="dialog"><div class="dialog-head"><div><div class="kicker">PROJECT / .ENV EDITOR</div><h2>${esc(state.projects[m.project].name)} · .env</h2><p>删除、新增和修改都先停留在编辑草稿，点击保存后才写回项目。</p></div><button class="close" data-action="close-modal">×</button></div><div class="env-editor"><div class="env-head">Environment key</div><div class="env-head">Value</div><div class="env-head">Action</div>${m.rows.map((r,i)=>`<div><input data-env-key="${i}" value="${esc(r[0])}" /></div><div><input data-env-value="${i}" value="${esc(r[1])}" /></div><div><button class="env-remove" data-action="remove-env" data-env-index="${i}">删除</button></div>`).join('')}</div><div class="dialog-foot"><button class="btn" data-action="add-env">＋ 增加凭证</button><button class="btn" data-action="close-modal">取消</button><button class="btn primary" data-action="save-env">保存 .env</button></div></div></div>`;if(m.kind==='profile')return `<div class="modal"><form class="dialog" id="profile-form"><div class="dialog-head"><div><div class="kicker">PROFILE / DETAIL DRAFT</div><h2>${m.index===null?'新建组合':'编辑组合详情'}</h2><p>在详情中调整组合名称与凭据成员，最终保存才生效。</p></div><button class="close" type="button" data-action="close-modal">×</button></div><div class="form-grid"><label>组合名称<input name="name" value="${esc(m.name)}" required /></label><label>组合说明<textarea name="description" rows="2">${esc(m.description)}</textarea></label></div><div class="profile-detail-heading" style="display:flex;justify-content:space-between;align-items:center;margin:22px 0 10px;color:var(--soft)"><strong>组合凭据 · ${m.ids.length}</strong><button class="btn" type="button" data-action="pick-profile">增加凭据</button></div><div class="profile-secret-list">${m.ids.map(id=>{const s=state.secrets.find(x=>x.id===id);return `<div class="project-row" style="padding:11px"><div><b>${esc(s?.name||id)}</b><p>${esc(s?.env||'无环境变量')}</p></div><button class="btn danger" type="button" data-action="remove-profile-secret" data-secret-id="${id}">从组合移除</button></div>`}).join('')||'<p class="subtitle">暂无凭据</p>'}</div><div class="dialog-foot"><button class="btn" type="button" data-action="close-modal">取消</button><button class="btn primary">最终保存组合</button></div></form></div>`;if(m.kind==='pick')return `<div class="modal"><div class="dialog small"><div class="dialog-head"><div><div class="kicker">PROFILE / PICK</div><h2>选择组合凭据</h2><p>勾选后点击确定，只会更新详情草稿。</p></div><button class="close" data-action="close-modal">×</button></div><div class="picker-list">${state.secrets.map(s=>`<label class="picker-row" style="display:flex;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)"><input type="checkbox" data-pick-secret="${s.id}" ${m.ids.includes(s.id)?'checked':''}/><span><b>${esc(s.name)}</b><small style="display:block;color:var(--muted);margin-top:4px">${esc(s.provider)} · ${esc(s.env||'无环境变量')}</small></span></label>`).join('')}</div><div class="dialog-foot"><button class="btn" data-action="close-modal">取消</button><button class="btn primary" data-action="confirm-pick">确定选择</button></div></div></div>`;return ''}
    function render(){const body=state.view==='providers'?providersView():state.view==='projects'?projectsView():state.view==='profiles'?profilesView():state.view==='settings'?settingsView():allView();$('#root').innerHTML=`<div class="app"><div>${sidebar()}</div><main class="main"><div class="topbar"><div><div class="eyebrow">SECURE LOCAL OPERATIONS</div><h1>${state.view==='all'?'凭据中心':state.view==='providers'?'服务商模型中心':state.view==='projects'?'项目管理':state.view==='profiles'?'配置组合':state.view==='settings'?'设置':state.view}</h1><p class="subtitle">从凭据类型到项目环境，把每次配置动作都留在可见、可控的本地流程里。</p></div><div class="top-actions"><button class="btn" data-action="language">English</button><button class="btn primary" data-action="add-secret">＋ 添加凭据</button></div></div>${body}${modal()}${state.toast?`<div class="toast ${state.toastError?'error':''}">${esc(state.toast)}</div>`:''}</main></div>`;bind()}
    function bind(){$('#search')?.addEventListener('input',e=>{state.search=e.target.value;render()});document.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>{state.view=b.dataset.nav;render()}));document.querySelectorAll('[data-select-secret]').forEach(b=>b.addEventListener('click',()=>{state.selected=b.dataset.selectSecret;render()}));document.querySelectorAll('[data-secret-check]').forEach(b=>b.addEventListener('change',e=>{const s=state.secrets.find(x=>x.id===e.target.dataset.secretCheck);s.selected=e.target.checked}));document.querySelectorAll('[data-provider]').forEach(b=>b.addEventListener('click',()=>{state.provider=b.dataset.provider;render()}));document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',handle));document.querySelectorAll('[data-external]').forEach(a=>a.addEventListener('click',()=>toast('已尝试打开系统浏览器')))}
    function handle(e){const a=e.currentTarget.dataset.action;if(a==='language')toast('原型当前聚焦中文流程，English 切换位已保留');if(a==='select-all'){const q=state.search.toLowerCase();const rows=state.secrets.filter(x=>(state.view==='all'||x.type===state.view)&&(`${x.name} ${x.provider} ${x.env}`.toLowerCase().includes(q)));const all=rows.every(x=>x.selected);rows.forEach(x=>x.selected=!all);render()}if(a==='add-secret')toast('添加凭据流程请在正式应用中从类型路由进入');if(a==='edit-secret')toast('编辑表单会保留原加密值，原型暂聚焦导航与管理页面');if(a==='copy-api')toast('API Key 已复制 · 原型提示');if(a==='copy-env')toast('项目 Env 内容已复制 · 原型提示');if(a==='validate')toast('已发起 Provider 验证 · 原型模拟结果：待验证');if(a==='audit')toast('操作审计页将在正式实现中接入');if(a==='open-project')toast('已尝试打开项目文件夹');if(a==='project-import')toast('项目导入流程：选择目录 → 读取 .env → 预览 → 确认');if(a==='edit-env'){const p=state.projects[+e.currentTarget.dataset.projectIndex];state.modal={kind:'env',project:+e.currentTarget.dataset.projectIndex,rows:[['OPENAI_API_KEY','••••••••••••'],['OPENAI_MODEL','gpt-5.5'],['OPENAI_BASE_URL','https://api.openai.com/v1']]};render()}if(a==='add-env'){state.modal.rows.push(['NEW_ENV_KEY','']);render()}if(a==='remove-env'){state.modal.rows.splice(+e.currentTarget.dataset.envIndex,1);render()}if(a==='save-env'){toast('项目 .env 已保存 · 原型模拟');state.modal=null;render()}if(a==='new-profile'){state.modal={kind:'profile',index:null,name:'',description:'',ids:[]};render()}if(a==='edit-profile'){const p=state.profiles[+e.currentTarget.dataset.profileIndex];state.modal={kind:'profile',index:+e.currentTarget.dataset.profileIndex,name:p.name,description:p.description,ids:[...p.ids]};render()}if(a==='apply-profile')toast('已将组合凭据载入导出流程');if(a==='remove-profile-secret'){state.modal.ids=state.modal.ids.filter(id=>id!==e.currentTarget.dataset.secretId);render()}if(a==='pick-profile'){state.modal={kind:'pick',ids:[...state.modal.ids]};render()}if(a==='confirm-pick'){state.modal={...state.modal,kind:'profile'};render()}if(a==='close-modal'){state.modal=null;render()}if(a==='add-model'){const p=state.providers.find(x=>x.id===state.provider)||state.providers[0];state.modal={kind:'model',index:null,name:p.name,id:'new-model',url:p.url};render()}if(a==='edit-model'){const p=state.providers.find(x=>x.id===state.provider)||state.providers[0];const m=p.models[+e.currentTarget.dataset.modelIndex];state.modal={kind:'model',index:+e.currentTarget.dataset.modelIndex,name:m[0],id:m[1],url:p.url};render()}}
    document.addEventListener('submit',e=>{if(e.target.id==='model-form'){e.preventDefault();state.modal=null;toast('模型默认配置已保存 · 原型模拟');render()}if(e.target.id==='profile-form'){e.preventDefault();const f=new FormData(e.target),p={id:state.modal.index===null?'new-'+Date.now():state.profiles[state.modal.index].id,name:f.get('name'),description:f.get('description'),ids:[...state.modal.ids]};if(state.modal.index===null)state.profiles.push(p);else state.profiles[state.modal.index]=p;state.modal=null;toast('配置组合已最终保存');render()}});
    document.addEventListener('change',e=>{if(e.target.dataset.pickSecret){if(e.target.checked&&!state.modal.ids.includes(e.target.dataset.pickSecret))state.modal.ids.push(e.target.dataset.pickSecret);if(!e.target.checked)state.modal.ids=state.modal.ids.filter(id=>id!==e.target.dataset.pickSecret)}});
    render();
  </script>
</body>
</html>
