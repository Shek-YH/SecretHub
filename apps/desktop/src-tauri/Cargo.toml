[package]
name = "secrethub-desktop"
version.workspace = true
description = "Local-first developer secret manager"
authors = ["SecretHub"]
edition.workspace = true
license.workspace = true

[lib]
name = "secrethub_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
arboard.workspace = true
dirs.workspace = true
rfd.workspace = true
secrethub-core = { path = "../../../crates/core" }
secrethub-backup = { path = "../../../crates/backup" }
secrethub-exporter = { path = "../../../crates/exporter" }
secrethub-storage = { path = "../../../crates/storage" }
serde.workspace = true
tauri = { version = "2.8", features = [] }
serde_json.workspace = true
